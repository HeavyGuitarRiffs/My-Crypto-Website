<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Blog Post</title>
    <style>
        body {
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .blog-container {
            max-width: 800px;
            margin: auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            position: relative;
        }
        .thumbnail {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #00ff00;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            color: #009900;
        }
        .edit-button, .delete-button, .save-button {
            margin-top: 10px;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        .edit-button {
            background: #ffcc00;
            color: black;
        }
        .delete-button {
            background: #ff4444;
            color: white;
        }
        .save-button {
            background: #00ff00;
            color: black;
        }
        .hidden {
            display: none;
        }
        .blog-input, .blog-textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="blog-container">
        <input type="file" id="imageUpload" class="hidden">
        <img id="blog-image" class="thumbnail" src="" alt="Blog Thumbnail" onerror="this.onerror=null;"this.src='/default-thumbnail.jpg';">

        
        <h1 id="blog-title"></h1>
        <input type="text" id="title-input" class="blog-input hidden">
        
        <p id="blog-date"></p>
        
        <p id="blog-content"></p>
        <p>👁 Views: <span id="post-views"></span></p>
        <textarea id="content-input" class="blog-textarea hidden"></textarea>
        
        <button class="edit-button" onclick="editBlog()">Edit</button>
        <button class="save-button hidden" onclick="saveChanges()">Save</button>
        <button class="delete-button" onclick="deleteBlog()">Delete</button>

        <a href="blog.html" class="back-link">← Back to Blog</a>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);
    const blogId = parseInt(params.get("id"));

    if (!blogId || isNaN(blogId)) {
        document.body.innerHTML = "<h2>Blog not found.</h2><a href='blog.html' class='back-link'>← Back to Blog</a>";
        return;
    }

    const blogs = JSON.parse(localStorage.getItem("savedBlogs") || "[]");
    const blog = blogs.find(b => b.id === parseInt(blogId));

    if (!blog) {
    document.body.innerHTML = "<h2>Blog not found.</h2><a href='blog.html' class='back-link'>← Back to Blog</a>";
    return;
}

    // Increment views for the blog
    blog.views += 1;
    localStorage.setItem("savedBlogs", JSON.stringify(blogs));

    // Display blog details
    document.getElementById("blog-title").textContent = blog.title;
    document.getElementById("blog-date").textContent = `Posted on ${new Date(blog.createdAt).toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
    })}`;
    document.getElementById("blog-content").textContent = blog.content;
    document.getElementById("post-views").textContent = blog.views;
    document.getElementById("blog-image").src = blog.coverImage || "images/default-thumbnail.jpg";
});
    

    function displayBlog(blog) {
        document.getElementById("blog-title").textContent = blog.title;
        document.getElementById("blog-content").textContent = blog.content;
        const dateElement = document.getElementById("blog-date");
if (blog.createdAt && !isNaN(new Date(blog.createdAt).getTime())) {
    dateElement.textContent = `Posted on: ${new Date(blog.createdAt).toLocaleString()}`;
} else {
    dateElement.textContent = "Posted on: Unknown Date"; // Fallback if date is invalid
}


        const blogImage = document.getElementById("blog-image");
        if (blog.coverImage && blog.coverImage.trim() !== "") {
    blogImage.src = blog.coverImage;
    blogImage.style.display = "block"; 
} else {
    blogImage.src = "/default-thumbnail.jpg"; // Ensure this default image exists
}


    }

     // Handle post views
     const postViewsElement = document.getElementById("post-views");
        if (postViewsElement) {
            if (blogId) {
    let views = localStorage.getItem(`postViews_${blogId}`) || 0;
    views = parseInt(views) + 1;
    postViewsElement.textContent = views;
    localStorage.setItem(`postViews_${blogId}`, views);
    

}

        }
    ;

    function editBlog() {
    document.getElementById("title-input").classList.remove("hidden");
    document.getElementById("content-input").classList.remove("hidden");
    document.getElementById("blog-title").classList.add("hidden");
    document.getElementById("blog-content").classList.add("hidden");

    document.querySelector(".edit-button").classList.add("hidden");
    document.querySelector(".save-button").classList.remove("hidden");

    // Pre-fill the input fields with the current blog data
    const blogId = parseInt(new URLSearchParams(window.location.search).get("id"));
    const blogs = JSON.parse(localStorage.getItem("savedBlogs") || "[]");
    const blog = blogs.find(b => b.id === blogId);

    if (blog) {
        document.getElementById("title-input").value = blog.title;
        document.getElementById("content-input").value = blog.content;
    }
}

function saveChanges() {
    const blogId = parseInt(new URLSearchParams(window.location.search).get("id"));
    let blogs = JSON.parse(localStorage.getItem("savedBlogs") || "[]");

    // Find the blog to update
    const blog = blogs.find(b => b.id === blogId);
    if (!blog) {
        alert("Blog not found!");
        return;
    }

    // Update the blog's title and content
    const updatedTitle = document.getElementById("title-input").value;
    const updatedContent = document.getElementById("content-input").value;

    if (!updatedTitle || !updatedContent) {
        alert("Title and Content cannot be empty!");
        return;
    }

    blog.title = updatedTitle;
    blog.content = updatedContent;

    // Save the updated blogs array back to localStorage
    localStorage.setItem("savedBlogs", JSON.stringify(blogs));

    alert("Blog updated successfully!");
    window.location.reload(); // Refresh the page to display updated content
}

async function deleteBlog() {
    if (confirm("Are you sure you want to delete this blog post?")) {
        const blogId = parseInt(new URLSearchParams(window.location.search).get("id"));
        if (!blogId || isNaN(blogId)) {
            alert("Invalid blog ID.");
            return;
        }

        let localBlogs = JSON.parse(localStorage.getItem("savedBlogs") || "[]");

        // Remove from localStorage
        localBlogs = localBlogs.filter(blog => blog.id !== blogId);
        localStorage.setItem("savedBlogs", JSON.stringify(localBlogs));

        // Attempt to delete from the backend
        try {
            const response = await fetch(`http://localhost:5001/api/blogs/${blogId}`, { method: "DELETE" });
            if (!response.ok) {
                throw new Error("Failed to delete blog from the backend.");
            }
        } catch (error) {
            console.warn("⚠️ Blog deleted locally, but not from the backend:", error);
        }

        alert("Blog deleted!");
        window.location.href = "blog.html";
    }
}
    
    </script>
</body>
</html>
